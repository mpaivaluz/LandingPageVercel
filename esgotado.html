<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Promoção esgotada | Achados Perfume</title>
    <link rel="icon" href="/fotoLP.png">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #0c0a0b;
            --wine-dark: #3a0f1f;
            --wine: #5c1630;
            --gold: #d8b46a;
            --gold-light: #f0dfb0;
            --gold-dark: #a9812f;
            --offwhite: #f7f1e6;
            --text-muted: #cabfab;
            --card-bg: rgba(255, 255, 255, 0.045);
            --card-border: rgba(216, 180, 106, 0.22);
            --whatsapp: #25d366;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background:
                radial-gradient(circle at 50% 0%, var(--wine) 0%, transparent 55%),
                radial-gradient(circle at 50% 100%, rgba(216, 180, 106, 0.12) 0%, transparent 50%),
                var(--black);
            color: var(--offwhite);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 20px;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            position: relative;
            width: 100%;
            max-width: 460px;
            text-align: center;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 44px 26px 32px;
            backdrop-filter: blur(6px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
            overflow: hidden;
            animation: rise 0.7s ease both;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 15%; right: 15%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: none; }
        }

        .logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 22px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--gold);
            box-shadow: 0 0 0 6px rgba(216, 180, 106, 0.1);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 16px;
            margin-bottom: 20px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            color: #ffb4b4;
            background: rgba(255, 90, 90, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.35);
            border-radius: 999px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff6b6b;
            animation: pulse 1.6s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 107, 107, 0.6); }
            70% { box-shadow: 0 0 0 9px rgba(255, 107, 107, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 107, 107, 0); }
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 700;
            font-size: 42px;
            line-height: 1.1;
            margin-bottom: 14px;
        }

        h1 em {
            font-style: normal;
            background: linear-gradient(135deg, var(--gold-light), var(--gold) 55%, var(--gold-dark));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        p.lead {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .divider {
            height: 1px;
            margin: 26px 0 22px;
            background: linear-gradient(90deg, transparent, var(--card-border), transparent);
        }

        .hint {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 14px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            border-radius: 14px;
            transition: transform 0.15s ease, filter 0.15s ease;
        }

        .btn:hover { transform: translateY(-2px); filter: brightness(1.08); }

        .btn-primary {
            color: #06210f;
            background: var(--whatsapp);
            box-shadow: 0 10px 28px rgba(37, 211, 102, 0.28);
        }

        .btn-ghost {
            margin-top: 12px;
            color: var(--gold-light);
            background: transparent;
            border: 1px solid var(--card-border);
        }

        .btn svg { width: 20px; height: 20px; fill: currentColor; }
    </style>
</head>

<body>
    <main class="card">
        <img class="logo" src="/fotoLP.png" alt="Achados Perfume">
        <span class="badge"><span class="dot"></span> Oferta encerrada</span>
        <h1>Essa promoção <em>esgotou</em></h1>
        <p class="lead">As melhores ofertas voam. O link que você abriu já expirou ou o estoque acabou, mas novas promoções de perfumes saem todos os dias.</p>

        <div class="divider"></div>

        <p class="hint">Não perca a próxima. Receba primeiro no WhatsApp:</p>
        <a class="btn btn-primary" id="vip" href="https://chat.whatsapp.com/D6o5rW17y6vKMSiax7xzCe">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.5 14.4c-.3-.1-1.7-.8-2-.9-.3-.1-.5-.1-.7.1-.2.3-.8.9-.9 1.1-.2.2-.3.2-.6.1-1.7-.8-2.8-1.500-3.900-3.400-.3-.5.3-.5.900-1.600.1-.2 0-.4 0-.5-.1-.1-.7-1.600-.9-2.200-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.500s1.100 2.900 1.200 3.100c.1.2 2.100 3.200 5.100 4.500 1.900.8 2.600.9 3.500.7.600-.1 1.700-.7 2-1.400.2-.7.2-1.300.2-1.400-.1-.2-.3-.3-.6-.4zM12 2a10 10 0 0 0-8.600 15L2 22l5.200-1.400A10 10 0 1 0 12 2z"/></svg>
            Entrar no grupo VIP
        </a>
        <a class="btn btn-ghost" href="/">Ver outras ofertas</a>
    </main>
</body>

</html>
