<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cupons de Perfumes | Links</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #18181b;
            --text-light: #f4f4f5;
            --text-gray: #a1a1aa;
            --whatsapp-green: #22c55e;
            --whatsapp-dark: #16a34a;
            --whatsapp-light: rgba(255, 255, 255, 0.2);
            --card-bg: #27272a;
            --orange: #f97316;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profile-container {
            position: relative;
            margin-bottom: 20px;
        }

        .profile-pic {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #3f3f46;
        }

        .status-dot {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 20px;
            height: 20px;
            background-color: var(--whatsapp-green);
            border-radius: 50%;
            border: 3px solid var(--bg-dark);
        }

        .title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .subtitle {
            font-size: 15px;
            color: var(--text-gray);
            margin-bottom: 24px;
            text-align: center;
        }

        .badge {
            background-color: rgba(249, 115, 22, 0.1);
            border: 1px solid rgba(249, 115, 22, 0.2);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
            color: var(--text-gray);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge .highlight {
            color: var(--orange);
            font-weight: 700;
        }

        .link-card {
            width: 100%;
            background-color: var(--whatsapp-green);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            text-decoration: none;
            color: white;
            margin-bottom: 16px;
            transition: transform 0.2s, filter 0.2s;
            box-shadow: 0 10px 25px -5px rgba(34, 197, 94, 0.3);
        }

        .link-card:hover {
            transform: translateY(-2px);
            filter: brightness(1.05);
        }

        .card-icon {
            width: 50px;
            height: 50px;
            background-color: var(--whatsapp-light);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            margin-right: 16px;
        }

        .card-icon svg {
            width: 28px;
            height: 28px;
            fill: white;
        }

        .card-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card-title {
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 4px;
        }

        .card-desc {
            font-size: 13px;
            opacity: 0.9;
        }

        .card-btn {
            background-color: var(--whatsapp-dark);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .redirect-wrapper {
            width: 100%;
            margin-top: 16px;
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 1px solid #3f3f46;
        }

        .redirect-text {
            font-size: 14px;
            color: var(--text-gray);
            margin-bottom: 12px;
        }

        .progress-container {
            width: 100%;
            height: 6px;
            background-color: #3f3f46;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--whatsapp-green);
            width: 100%;
            border-radius: 10px;
            transition: width 3s linear;
        }

        .countdown-number {
            font-weight: 700;
            color: white;
        }

        .social-links {
            display: flex;
            gap: 16px;
            margin-bottom: 32px;
        }

        .social-icon {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 44px;
            height: 44px;
            background-color: var(--card-bg);
            border-radius: 50%;
            color: var(--text-light);
            text-decoration: none;
            transition: transform 0.2s, background-color 0.2s;
            border: 1px solid #3f3f46;
        }

        .social-icon:hover {
            transform: translateY(-2px);
            background-color: #3f3f46;
        }

        .social-icon svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }
    </style>

        !function (f, b, e, v, n, t, s) {

            src="https://www.facebook.com/tr?id=1537658158044777&ev=PageView&noscript=1" /></noscript>

</head>

<body>

    <div class="container">

        <div class="profile-container">
            <!-- Usando a logo do site ou um avatar placeholder elegante -->
            <img src="fotoLP.jpg" alt="Profile" class="profile-pic">
            <div class="status-dot"></div>
        </div>

        <h1 class="title">🎟️ Cupons VIP</h1>
        <p class="subtitle">As melhores promoções de Perfumes exclusivas para você!</p>

        <div class="badge">
            🔥 <span class="highlight">+ de 10.000</span> pessoas já estão economizando!
        </div>

        <div class="social-links">

                </svg>
            </a>
        </div>

        <a href="https://chat.whatsapp.com/D6o5rW17y6vKMSiax7xzCe" class="link-card">

                </svg>
            </div>
            <div class="card-content">
                <div class="card-title">Grupo do WhatsApp</div>
                <div class="card-desc">Receba ofertas em tempo real</div>
            </div>
            <div class="card-btn">
                ENTRAR
            </div>
        </a>

        <div class="redirect-wrapper">
            <p class="redirect-text">Você será redirecionado para o grupo em <span class="countdown-number"
                    id="countdown">1</span>s...</p>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>

    </div>

    <script>
        const countdownEl = document.getElementById('countdown');
        const progressBar = document.getElementById('progressBar');
        const targetUrl = "https://chat.whatsapp.com/D6o5rW17y6vKMSiax7xzCe";
        let timeLeft = 1;

        // Inicia a animação da barra diminuindo
        setTimeout(() => {
            progressBar.style.width = "0%";
        }, 50);

        // Atualiza o texto do contador
        const timer = setInterval(() => {
            timeLeft--;
            countdownEl.textContent = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(timer);
                window.location.href = targetUrl;
            }
        }, 1000);
    </script>
</body>

</html>
